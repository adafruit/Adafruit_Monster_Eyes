name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- RP2040 / RP2350 ----------------------------------------------
          # FS 0MB: assets live in the CircuitPython partition at 1 MB, so the
          # core must not also claim a filesystem at the end of flash.
          - name: feather-rp2040-dvi
            fqbn: rp2040:rp2040:adafruit_feather_dvi:flash=8388608_0
            core: rp2040
            defines: ""              # profile already picks DVI, one eye

          - name: feather-rp2040-st7789-1eye
            fqbn: rp2040:rp2040:adafruit_feather:flash=8388608_0
            core: rp2040
            defines: "-DEYE_PANEL=EYE_PANEL_ST7789 -DNUM_EYES=1"

          - name: feather-rp2040-st7789-2eye
            fqbn: rp2040:rp2040:adafruit_feather:flash=8388608_0
            core: rp2040
            defines: "-DEYE_PANEL=EYE_PANEL_ST7789 -DNUM_EYES=2"

          - name: feather-rp2040-gc9a01a-2eye
            fqbn: rp2040:rp2040:adafruit_feather:flash=8388608_0
            core: rp2040
            defines: "-DEYE_PANEL=EYE_PANEL_GC9A01A -DNUM_EYES=2"

          - name: feather-rp2350-gc9a01a-2eye
            fqbn: rp2040:rp2040:adafruit_feather_rp2350:flash=8388608_0
            core: rp2040
            defines: "-DNUM_EYES=2"

          - name: metro-rp2350-gc9a01a-2eye
            fqbn: rp2040:rp2040:adafruit_metro_rp2350:flash=8388608_0
            core: rp2040
            defines: "-DNUM_EYES=2"

          - name: metro-rp2350-st7789-2eye
            fqbn: rp2040:rp2040:adafruit_metro_rp2350:flash=8388608_0
            core: rp2040
            defines: "-DEYE_PANEL=EYE_PANEL_ST7789 -DNUM_EYES=2"

          - name: qtpy-rp2040-gc9a01a-1eye
            fqbn: rp2040:rp2040:adafruit_qtpy:flash=8388608_0
            core: rp2040
            defines: ""

          # ---- ESP32 --------------------------------------------------------
          # PartitionScheme must provide a FATFS partition or the asset drive
          # cannot mount.
          - name: metro-esp32s3-st7789-2eye
            fqbn: esp32:esp32:adafruit_metro_esp32s3:PartitionScheme=ffat,USBMode=default
            core: esp32
            defines: "-DEYE_PANEL=EYE_PANEL_ST7789 -DNUM_EYES=2"

          - name: metro-esp32s3-gc9a01a-2eye
            fqbn: esp32:esp32:adafruit_metro_esp32s3:PartitionScheme=ffat,USBMode=default
            core: esp32
            defines: "-DEYE_PANEL=EYE_PANEL_GC9A01A -DNUM_EYES=2"

          - name: qtpy-esp32s2-gc9a01a-1eye
            fqbn: esp32:esp32:adafruit_qtpy_esp32s2:PartitionScheme=ffat
            core: esp32
            defines: ""

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Add board manager URLs
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

      - name: Install core
        run: arduino-cli core install ${{ matrix.core }}:${{ matrix.core }}

      - name: Install libraries
        run: |
          arduino-cli lib install \
            "Adafruit GFX Library" \
            "Adafruit BusIO" \
            "Adafruit ST7735 and ST7789 Library" \
            "Adafruit GC9A01A" \
            "Adafruit ILI9341" \
            "ArduinoJson" \
            "SdFat - Adafruit Fork" \
            "Adafruit SPIFlash" \
            "Adafruit TinyUSB Library"
          # PicoDVI is the Adafruit fork and is not in the library index.
          if [ "${{ matrix.core }}" = "rp2040" ]; then
            git clone --depth 1 https://github.com/adafruit/PicoDVI.git \
              "$HOME/Arduino/libraries/PicoDVI"
          fi

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn "${{ matrix.fqbn }}" \
            --build-property "compiler.cpp.extra_flags=${{ matrix.defines }}" \
            --output-dir "build/${{ matrix.name }}" \
            --warnings default \
            RP2_Eyes

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            build/${{ matrix.name }}/*.uf2
            build/${{ matrix.name }}/*.bin
          if-no-files-found: error

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install clang-format
      - run: |
          clang-format --style=file --dry-run --Werror \
            RP2_Eyes/*.h RP2_Eyes/*.cpp RP2_Eyes/*.ino
