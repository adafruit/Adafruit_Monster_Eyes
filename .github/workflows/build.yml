name: build

# One artifact per board / panel / eye-count combination on release
# CI tests for feather rp2040, feather esp32s3, picodvi and qualia
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  # matrix lives in tools/ci_matrix.py
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        run: |
          if [ "${{ github.event_name }}" = "release" ] || \
             [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 tools/ci_matrix.py release >> "$GITHUB_OUTPUT"
          else
            python3 tools/ci_matrix.py smoke >> "$GITHUB_OUTPUT"
          fi
          python3 tools/ci_matrix.py | head -1

  build:
    needs: matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUBLISH: ${{ github.event_name == 'release' ||
        github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Add board manager URLs
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index

      - name: Install core
        run: arduino-cli core install ${{ matrix.core }}:${{ matrix.core }}

      - name: Install libraries
        run: |
          arduino-cli lib install \
            "Adafruit GFX Library" \
            "Adafruit BusIO" \
            "Adafruit ST7735 and ST7789 Library" \
            "Adafruit GC9A01A" \
            "Adafruit ILI9341" \
            "ArduinoJson" \
            "SdFat - Adafruit Fork" \
            "Adafruit SPIFlash" \
            "GFX Library for Arduino"
          if [ "${{ matrix.core }}" = "esp32" ]; then
            arduino-cli lib install "Adafruit TinyUSB Library"
          fi
          # PicoDVI is the Adafruit fork and is not in the library index.
          if [ "${{ matrix.core }}" = "rp2040" ]; then
            git clone --depth 1 https://github.com/adafruit/PicoDVI.git \
              "$HOME/Arduino/libraries/PicoDVI"
          fi

      - name: Locate the sketch
        id: sketch
        run: |
          INO=$(find . -name '*.ino' -not -path './build/*' | head -n 1)
          if [ -z "$INO" ]; then
            echo "No .ino found in the checkout." >&2
            exit 1
          fi
          DIR=$(dirname "$INO")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Sketch: $INO (directory $DIR)"

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn "${{ matrix.fqbn }}" \
            --build-property "compiler.cpp.extra_flags=${{ matrix.defines }}" \
            --output-dir "build/${{ matrix.name }}" \
            --warnings default \
            "${{ steps.sketch.outputs.dir }}"

      - name: Collect the binary
        if: env.PUBLISH == 'true'
        run: |
          SRC="build/${{ matrix.name }}"
          BASE="${{ matrix.asset || matrix.name }}"
          mkdir -p dist
          if ls "$SRC"/*.uf2 >/dev/null 2>&1; then
            cp "$SRC"/*.uf2 "dist/$BASE.uf2"      # RP2040 / RP2350, native
          elif [ -n "${{ matrix.family }}" ]; then
            wget -q --no-check-certificate \
              https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py \
              https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2families.json
            # The APP binary: the bootloader is already on the board.
            APP=$(ls "$SRC"/*.ino.bin 2>/dev/null | head -n 1)
            if [ -z "$APP" ]; then
              echo "No .ino.bin to convert in $SRC" >&2; ls -la "$SRC" >&2; exit 1
            fi
            python3 uf2conv.py "$APP" -c -f "${{ matrix.family }}" \
              -b 0x0000 -o "dist/$BASE.uf2"
          else
            echo "No .uf2 and no UF2 family for this board" >&2
            ls -la "$SRC" >&2
            exit 1
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: ${{ matrix.bundle }}__${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: adafruit/ci-arduino
          path: ci
      - name: pre-install
        run: bash ci/actions_install.sh
      - name: clang
        run: python3 ci/run-clang-format.py -e "ci/*" -e "bin/*" -r .
      - name: doxygen
        env:
          GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
          PRETTYNAME: "Adafruit Monster Eyes"
        run: bash ci/doxy_gen_and_deploy.sh Adafruit_Monster_Eyes

  # Builds are grouped into one zip per board, so a release lists a handful of
  # named archives
  bundle:
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: incoming

      - name: Group by board and zip
        run: |
          set -e
          # Each artifact arrives as incoming/<bundle>__<name>/<file>.
          for d in incoming/*/; do
            a=$(basename "$d")
            case "$a" in
              *__*) grp="${a%%__*}" ;;
              *) echo "Skipping unexpected artifact $a" >&2; continue ;;
            esac
            mkdir -p "stage/$grp"
            cp "$d"* "stage/$grp/"
          done
          mkdir -p out
          for g in stage/*/; do
            g=$(basename "$g")
            (cd stage && zip -r "../out/$g.zip" "$g")
          done
          echo "== assembled =="
          for z in out/*.zip; do
            echo "--- $z"
            unzip -l "$z" | sed -n '4,30p'
          done

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/*.zip
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
